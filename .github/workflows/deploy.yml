name: Deploy to Cloud Run
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/49926531786/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: star-jar-deployer@star-jar-505202.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: star-jar-505202

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build -t gcr.io/star-jar-505202/star-jar:$GITHUB_SHA .
          docker push gcr.io/star-jar-505202/star-jar:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy star-jar \
            --image gcr.io/star-jar-505202/star-jar:$GITHUB_SHA \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --project star-jar-505202
