name: Deploy to Cloud Run
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/49926531786/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: star-jar-deployer@star-jar-505202.iam.gserviceaccount.com
          token_format: access_token

      - name: Configure Docker for GCR
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://gcr.io

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/star-jar-505202/star-jar:$GITHUB_SHA .
          docker push gcr.io/star-jar-505202/star-jar:$GITHUB_SHA

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: star-jar
          image: gcr.io/star-jar-505202/star-jar:${{ github.sha }}
          region: us-central1
          project_id: star-jar-505202
          flags: --allow-unauthenticated
